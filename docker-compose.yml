version: '3.8'

# ==============================================================================
# DEALFORGE AI: 5-CONTAINER ENTERPRISE MICROSERVICE DEPLOYMENT ARCHITECTURE
#
# Container 1: dealforge_app         - FastAPI Backend, CrewAI 8-Agent Pipeline, FastMCP Server, Web UI
# Container 2: dealforge_adk_service - Google ADK Autonomous Risk Auditor Microservice (A2A Protocol)
# Container 3: dealforge_mysql       - MySQL 8.0 Transactional Relational Database (ACID compliant)
# Container 4: dealforge_langfuse    - Langfuse OSS Server & Web UI (Port 3000) / Cloud Bridge
# Container 5: dealforge_langfuse_db - PostgreSQL 15 Database for Langfuse Traces & Observability
# ==============================================================================

services:
  # Container 1: MySQL Enterprise Relational Database
  mysql:
    image: mysql:8.0
    container_name: dealforge_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dealforge_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Container 2: DealForge AI Primary Application Server (FastAPI + CrewAI + FastMCP)
  app:
    build: .
    container_name: dealforge_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "80:8000"
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=dealforge_db
      - DEMO_MODE=True
      - ADK_SERVICE_HOST=adk_service
      - ADK_SERVICE_PORT=8001
      - LANGFUSE_HOST=https://cloud.langfuse.com
      - LANGFUSE_PUBLIC_KEY=pk-lf-dealforge-enterprise-prod-2026
      - LANGFUSE_SECRET_KEY=sk-lf-dealforge-enterprise-prod-2026
      - LANGFUSE_ENABLED=True
    volumes:
      - .:/app

  # Container 3: Independent Google ADK Risk Assessment Microservice (A2A Protocol)
  adk_service:
    build: .
    container_name: dealforge_adk_service
    restart: always
    ports:
      - "8001:8001"
    command: ["uvicorn", "app.adk_service.server:adk_app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - DEMO_MODE=True
    volumes:
      - .:/app

  # Container 4: Dedicated PostgreSQL Database for Langfuse Traces
  langfuse_db:
    image: postgres:15-alpine
    container_name: dealforge_langfuse_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: langfusepassword
      POSTGRES_DB: langfuse
    ports:
      - "5432:5432"
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Container 5: Official Langfuse Observability & Tracing Server
  langfuse:
    image: langfuse/langfuse:2
    container_name: dealforge_langfuse
    restart: always
    depends_on:
      langfuse_db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:langfusepassword@langfuse_db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dealforge-langfuse-secret-key-32charsmin
      - SALT=dealforge-langfuse-salt-value
      - TELEMETRY_ENABLED=false

volumes:
  mysql_data:
  langfuse_pgdata:
