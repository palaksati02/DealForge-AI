version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dealforge_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dealforge_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: dealforge_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=dealforge_db
      - DEMO_MODE=True
      - ADK_SERVICE_HOST=adk_service
      - ADK_SERVICE_PORT=8001
      - A2A_BASE_URL=http://app:8000/a2a
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  adk_service:
    build: .
    container_name: dealforge_adk_service
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8001:8001"
    command: ["uvicorn", "app.adk_service.server:adk_app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - DEMO_MODE=True
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=dealforge_db
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
