services:
  - type: web
    name: dealforge-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: AUTO_APPROVAL_THRESHOLD
        value: "1000000.00"
      - key: PYTHON_VERSION
        value: 3.11.9
